name: Source and synthetic regressions
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned runtime and apply project changes
        shell: bash
        run: |
          python -B - <<'PY'
          import json, subprocess
          from pathlib import Path
          spec = json.loads(Path('dependencies.json').read_text())['runtime']
          target = Path('.local') / spec['directory']
          target.mkdir(parents=True)
          def git(*args):
              subprocess.run(['git', '-C', str(target), *args], check=True)
          git('init')
          git('remote', 'add', 'origin', spec['url'])
          git('fetch', '--depth', '1', 'origin', spec['commit'])
          git('checkout', '--detach', 'FETCH_HEAD')
          git('apply', str(Path('tools/runtime-diagnostics.patch').resolve()))
          PY
      - name: Audit source and run invented-data Python tests
        shell: bash
        run: |
          python -B tools/check-source-package.py --tracked --out "$RUNNER_TEMP/source-check.json"
          python -X utf8 -B -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Python tests from a payload-style copy (no git checkout)
        shell: bash
        run: |
          # The packaged application ships `git ls-files` plus the runtime sources, with no .git.
          # Run the suite the way tools/validate-posix-package.py does, so checkout-only
          # assumptions fail here instead of only in the Linux/macOS candidates workflow.
          app="$RUNNER_TEMP/payload-app"
          mkdir -p "$app/.local/saturn-recomp"
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C "$app"
          cp -R .local/saturn-recomp/src .local/saturn-recomp/runtime "$app/.local/saturn-recomp/"
          (cd "$app" && find . -type f | sort) > "$RUNNER_TEMP/payload-before.txt"
          cd "$RUNNER_TEMP"
          python -X utf8 -B -m unittest discover -s "$app/tools/tests" -p 'test_*.py'
          # Like package-files-unchanged: the suite must not write into the application.
          (cd "$app" && find . -type f | sort) | diff "$RUNNER_TEMP/payload-before.txt" -
      - name: Translation patcher (synthetic discs, pure-Python EDC/ECC)
        shell: bash
        run: |
          python -B -m tools.sf3patch --version
          python -X utf8 -B -c "import sys; sys.modules['numpy'] = None; import unittest; r = unittest.main(module=None, argv=['t', 'discover', '-s', 'tools/tests', '-p', 'test_sf3patch_*.py', '-v'], exit=False).result; sys.exit(not r.wasSuccessful())"
      - name: Build required runtime regressions
        shell: bash
        run: |
          cmake -S tools/tests -B "$RUNNER_TEMP/sfiii-checks" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ "-DSATURN_RUNTIME=$GITHUB_WORKSPACE/.local/saturn-recomp/runtime"
          cmake --build "$RUNNER_TEMP/sfiii-checks" --parallel 2 --target dsp_regression core_regression bup_regression machine_regression background_regression audio_buffer game_speed runtime_tests overlay_state_regression
      - name: Run required runtime regressions
        shell: bash
        run: |
          for target in dsp_regression core_regression bup_regression machine_regression background_regression audio_buffer game_speed overlay_state_regression; do
            "$RUNNER_TEMP/sfiii-checks/$target"
          done
          "$RUNNER_TEMP/sfiii-checks/upstream/runtime_tests"
      # Real disc inventories, generated game code and gameplay fixtures stay local.
